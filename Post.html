<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social Post Card</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #e8ebf0;
    font-family: -apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 20px 0;
    gap: 16px;
  }

  .card {
    background: #ffffff;
    border-radius: 18px;
    overflow: hidden;
    width: 100%;
    max-width: 480px;
  }

  /* Header */
  .card-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px 10px;
  }

  .avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    overflow: hidden;
    flex-shrink: 0;
  }

  .avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .header-info {
    display: flex;
    flex-direction: column;
  }

  .author-name {
    font-size: 13px;
    font-weight: 600;
    color: #1a1a1a;
  }

  .post-date {
    font-size: 11px;
    color: #939393;
    margin-top: 1px;
  }

  .header-menu {
    margin-left: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px;
    border-radius: 50%;
    -webkit-tap-highlight-color: transparent;
  }

  .header-menu:hover {
    background: #f0f0f0;
  }

  /* Carousel Section */
  .carousel-outer {
    position: relative;
    width: 100%;
    padding: 0;
  }

  .carousel-track {
    display: flex;
    gap: 3px;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    scrollbar-width: none;
    padding-left: 3px;
    padding-right: 3px;
  }

  .carousel-track::-webkit-scrollbar {
    display: none;
  }

  .carousel-slide {
    flex: 0 0 calc(100% - 7px);
    aspect-ratio: 4/3;
    overflow: hidden;
    border-radius: 4px;
    position: relative;
    scroll-snap-align: center;
  }

  .carousel-slide img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* Counter Badge */
  .carousel-counter {
    position: absolute;
    top: 10px;
    right: 10px;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    color: #fff;
    font-size: 12px;
    font-weight: 500;
    padding: 3px 8px;
    border-radius: 4px;
    letter-spacing: 0.2px;
    pointer-events: none;
    z-index: 10;
  }

  /* Dots Indicator */
  .carousel-dots {
    display: flex;
    justify-content: center;
    gap: 5px;
    padding: 12px 0 8px;
    background: #fff;
  }

  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #d0d4dc;
    transition: background 0.25s, transform 0.25s;
    cursor: pointer;
  }

  .dot.active {
    background: #3f8ae0;
    transform: scale(1.15);
  }

  /* Footer Section */
  .card-footer {
    display: flex;
    align-items: center;
    padding: 10px 14px 14px;
    gap: 8px;
    background: #fff;
  }

  .pc-action-btn {
    display: flex;
    align-items: center;
    cursor: pointer;
    background: none;
    border: none;
    padding: 0;
    outline: none;
    -webkit-tap-highlight-color: transparent;
    line-height: 1;
  }

  .footer-pill {
    background: #f0f2f5;
    border-radius: 20px;
    padding: 8px 16px;
    display: inline-flex;
    align-items: center;
    transition: background 0.25s;
  }

  .pc-date {
    font-size: 12px;
    color: #aaa;
    font-weight: 500;
    white-space: nowrap;
  }

  .heart-svg {
    transition: all 0.25s ease;
  }

  /* Heart pop animation */
  @keyframes heartPop {
    0%   { transform: scale(1); }
    40%  { transform: scale(1.35); }
    70%  { transform: scale(0.9); }
    100% { transform: scale(1); }
  }

  .heart-svg.popping {
    animation: heartPop 0.35s ease forwards;
  }
</style>
</head>
<body>

<script>
  // Card 1 carousel
  const track1 = document.getElementById('carouselTrack1');
  const dots1 = document.querySelectorAll('#carouselDots1 .dot');

  track1.addEventListener('scroll', () => {
    const slide = track1.querySelector('.carousel-slide');
    if (!slide) return;
    const slideWidth = slide.getBoundingClientRect().width + 3;
    const currentActive = Math.round(track1.scrollLeft / slideWidth);
    dots1.forEach((d, i) => d.classList.toggle('active', i === currentActive));
  });

  dots1.forEach(dot => {
    dot.addEventListener('click', () => {
      const index = parseInt(dot.dataset.index);
      const slide = track1.querySelector('.carousel-slide');
      if (!slide) return;
      const slideWidth = slide.getBoundingClientRect().width + 3;
      track1.scrollTo({ left: index * slideWidth, behavior: 'smooth' });
    });
  });

  // Like toggle
  const likeStates = {};
  const likeCounts = {};

  function formatCount(n) {
    if (n >= 1000000) return (n / 1000000).toFixed(n % 1000000 === 0 ? 0 : 1) + 'M';
    if (n >= 1000) return (n / 1000).toFixed(n % 1000 === 0 ? 0 : 1) + 'k';
    return 'Liked';
  }

  function toggleLike(id) {
    likeStates[id] = !likeStates[id];
    if (likeCounts[id] === undefined) likeCounts[id] = 0;
    likeCounts[id] += likeStates[id] ? 1 : -1;

    const btn = document.getElementById(id);
    const svg = btn.querySelector('.heart-svg');
    const label = btn.querySelector('.like-label');
    const liked = likeStates[id];
    const count = likeCounts[id];

    btn.classList.toggle('liked', liked);
    svg.setAttribute('fill', liked ? '#e64646' : 'none');
    svg.setAttribute('stroke', liked ? '#e64646' : '#aaa');
    label.style.color = liked ? '#e64646' : '#aaa';

    if (!liked) {
      label.textContent = 'Like';
    } else if (count >= 1000) {
      label.textContent = formatCount(count);
    } else {
      label.textContent = 'Liked';
    }

    // Pop animation on like
    if (liked) {
      svg.classList.remove('popping');
      void svg.offsetWidth;
      svg.classList.add('popping');
      svg.addEventListener('animationend', () => svg.classList.remove('popping'), { once: true });
    }
  }
</script>
