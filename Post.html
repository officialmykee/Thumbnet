<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social Post Card</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #e8ebf0;
    font-family: -apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    padding: 20px 0;
  }

  .card {
    background: #ffffff;
    border-radius: 18px;
    overflow: hidden;
    width: 100%;
    max-width: 480px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  }

  /* Header */
  .card-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px 10px;
  }

  .avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    overflow: hidden;
    flex-shrink: 0;
  }

  .avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .header-info {
    display: flex;
    flex-direction: column;
  }

  .author-name {
    font-size: 13px;
    font-weight: 600;
    color: #1a1a1a;
  }

  .post-date {
    font-size: 11px;
    color: #939393;
    margin-top: 1px;
  }

  /* Carousel Section */
  .carousel-outer {
    position: relative;
    width: 100%;
    padding: 0;
  }

  .carousel-track {
    display: flex;
    gap: 3px; /* 3px gap between images */
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    scrollbar-width: none;
    
    /* Small structural padding padding to assist scroll snapping limits */
    padding-left: 3px; 
    padding-right: 3px;
  }

  .carousel-track::-webkit-scrollbar {
    display: none;
  }

  .carousel-slide {
    /* FIX: Updated to your exact requested calculation */
    flex: 0 0 calc(100% - 7px); 
    aspect-ratio: 4/3;
    overflow: hidden;
    border-radius: 4px;
    position: relative;
    scroll-snap-align: center;
  }

  .carousel-slide img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* Counter Badge */
  .carousel-counter {
    position: absolute;
    top: 10px;
    right: 10px;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    color: #fff;
    font-size: 12px;
    font-weight: 500;
    padding: 3px 8px;
    border-radius: 4px;
    letter-spacing: 0.2px;
    pointer-events: none;
    z-index: 10;
  }

  /* Dots Indicator */
  .carousel-dots {
    display: flex;
    justify-content: center;
    gap: 5px;
    padding: 12px 0 8px;
    background: #fff;
  }

  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #d0d4dc;
    transition: background 0.25s, transform 0.25s;
    cursor: pointer;
  }

  .dot.active {
    background: #3f8ae0;
    transform: scale(1.15);
  }

  /* Footer Section */
  .card-footer {
    display: flex;
    align-items: center;
    padding: 10px 14px 14px;
    gap: 8px;
    background: #fff;
  }

  .pc-action-btn {
    display: flex;
    align-items: center;
    cursor: pointer;
    background: none;
    border: none;
    padding: 0;
    outline: none;
    -webkit-tap-highlight-color: transparent;
    line-height: 1;
  }

  .footer-pill {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.10);
    padding: 8px 16px;
    display: inline-flex;
    align-items: center;
    transition: background 0.25s, box-shadow 0.25s;
  }

  .pc-date {
    font-size: 12px;
    color: #aaa;
    font-weight: 500;
    white-space: nowrap;
  }

  .heart-svg {
    transition: all 0.25s ease;
  }

  .like-btn.liked .heart-svg {
    fill: #e64646;
    stroke: #e64646;
  }

  .like-btn.liked .like-label {
    color: #e64646 !important;
  }
</style>
</head>
<body>

<div class="card">
  <div class="card-header">
    <div class="avatar">
      <img src="https://i.ibb.co/cKwmMcLD/images.jpg" alt="User">
    </div>
    <div class="header-info">
      <span class="author-name">Yulia Yarymdzhanyan</span>
      <span class="post-date">6 Oct 2024</span>
    </div>
  </div>

  <div class="carousel-outer">
    <div class="carousel-track" id="carouselTrack">
      <div class="carousel-slide">
        <div class="carousel-counter">1 / 3</div>
        <img src="https://picsum.photos/seed/family1/480/360" alt="Photo 1">
      </div>
      <div class="carousel-slide">
        <div class="carousel-counter">2 / 3</div>
        <img src="https://picsum.photos/seed/nature22/480/360" alt="Photo 2">
      </div>
      <div class="carousel-slide">
        <div class="carousel-counter">3 / 3</div>
        <img src="https://picsum.photos/seed/park77/480/360" alt="Photo 3">
      </div>
    </div>
  </div>

  <div class="carousel-dots" id="carouselDots">
    <div class="dot active" data-index="0"></div>
    <div class="dot" data-index="1"></div>
    <div class="dot" data-index="2"></div>
  </div>

  <div class="card-footer">
    <div class="footer-pill">
      <button class="pc-action-btn like-btn" id="likeBtn" onclick="toggleLike()">
        <svg class="heart-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#aaa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
        </svg>
        <span class="like-label" style="color:#aaa;font-weight:600;font-size:13px;margin-left:5px;">Like</span>
      </button>
    </div>

    <div class="footer-pill" style="margin: 0 auto;">
      <button class="pc-action-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#aaa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
        </svg>
        <span style="color:#aaa;font-weight:600;font-size:13px;margin-left:5px;">Comment</span>
      </button>
    </div>

    <div class="pc-date">6 Oct 2024</div>
  </div>
</div>

<script>
  const track = document.getElementById('carouselTrack');
  const dots = document.querySelectorAll('.dot');

  // Updated track width scroll math to factor in the tighter 3px gap
  track.addEventListener('scroll', () => {
    const slide = track.querySelector('.carousel-slide');
    if(!slide) return;
    const slideWidth = slide.getBoundingClientRect().width + 3;
    const currentActive = Math.round(track.scrollLeft / slideWidth);
    
    dots.forEach((d, i) => d.classList.toggle('active', i === currentActive));
  });

  // Smooth dot scroll behavior
  dots.forEach(dot => {
    dot.addEventListener('click', () => {
      const index = parseInt(dot.dataset.index);
      const slide = track.querySelector('.carousel-slide');
      if(!slide) return;
      const slideWidth = slide.getBoundingClientRect().width + 3;
      
      track.scrollTo({
        left: index * slideWidth,
        behavior: 'smooth'
      });
    });
  });

  // Like Toggle Handler
  let liked = false;
  function toggleLike() {
    liked = !liked;
    const btn = document.getElementById('likeBtn');
    const svg = btn.querySelector('.heart-svg');
    const label = btn.querySelector('.like-label');
    btn.classList.toggle('liked', liked);
    svg.setAttribute('fill', liked ? '#e64646' : 'none');
    svg.setAttribute('stroke', liked ? '#e64646' : '#aaa');
    label.style.color = liked ? '#e64646' : '#aaa';
  }
</script>
</body>
</html>
