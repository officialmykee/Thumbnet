<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Home Header</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .sticky-top {
      position: sticky;
      top: 0;
      z-index: 100;
      background: #ffffff;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .scroll-feed {
      width: 100%;
      max-width: 430px;
      overflow-y: auto;
      flex: 1;
      background: #f0f2f5;
      padding: 8px 0;
    }

    .scroll-feed::-webkit-scrollbar { display: none; }
    .scroll-feed { scrollbar-width: none; }

    .header {
      width: 100%;
      max-width: 430px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      background: #ffffff;
    }

    /* Left: avatar + title */
    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      overflow: hidden;
      flex-shrink: 0;
      background: #333;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .title {
      font-size: 20px;
      font-weight: 700;
      color: #111111;
      letter-spacing: -0.3px;
    }

    /* Right: icons */
    .header-right {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-plus {
      width: 28px;
      height: 28px;
    }

    .icon-bell {
      width: 26px;
      height: 26px;
    }

    /* Stories row */
    .stories-row {
      width: 100%;
      max-width: 430px;
      display: flex;
      align-items: flex-start;
      gap: 20px;
      padding: 10px 16px 16px;
      background: #ffffff;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .stories-row::-webkit-scrollbar {
      display: none;
    }

    .story-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .story-avatar-wrap {
      position: relative;
      width: 76px;
      height: 76px;
    }

    .story-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid #5e7ca2;
    }

    .story-ring-own {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1px solid #cccccc;
    }

    .story-photo {
      position: absolute;
      inset: 4px;
      border-radius: 50%;
      overflow: hidden;
      background: #2a2a2a;
    }

    .story-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .story-plus-badge {
      position: absolute;
      bottom: 2px;
      right: 2px;
      width: 26px;
      height: 26px;
      background: #3B97F0;
      border-radius: 50%;
      border: 2.5px solid #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    .story-plus-badge::before,
    .story-plus-badge::after {
      content: '';
      position: absolute;
      background: #ffffff;
      border-radius: 2px;
    }

    .story-plus-badge::before {
      width: 2px;
      height: 12px;
    }

    .story-plus-badge::after {
      width: 12px;
      height: 2px;
    }

    .story-label {
      font-size: 13px;
      color: #111111;
      text-align: center;
    }

    .story-label-blue {
      color: #3B97F0;
      font-weight: 500;
    }

    /* Skeleton Loader */
    @keyframes shimmer {
      0%   { background-position: -700px 0; }
      100% { background-position: 700px 0; }
    }

    .skeleton-feed {
      width: 100%;
      max-width: 430px;
      background: #f0f2f5;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .sk-shine {
      background: linear-gradient(90deg, #ececec 25%, #f5f5f5 50%, #ececec 75%);
      background-size: 700px 100%;
      animation: shimmer 1.4s infinite linear;
      border-radius: 6px;
    }

    .sk-stories {
      background: #fff;
      display: flex;
      gap: 20px;
      padding: 10px 16px 16px;
      overflow: hidden;
    }
    .sk-story {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      flex-shrink: 0;
    }
    .sk-story-circle {
      width: 68px;
      height: 68px;
      border-radius: 50%;
    }
    .sk-story-label {
      width: 48px;
      height: 10px;
      border-radius: 5px;
    }

    .sk-card {
      background: #fff;
      margin-bottom: 8px;
      padding: 14px 16px 14px;
    }

    .sk-card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .sk-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .sk-name-block {
      display: flex;
      flex-direction: column;
      gap: 7px;
      flex: 1;
    }
    .sk-name {
      width: 140px;
      height: 13px;
      border-radius: 5px;
    }
    .sk-location {
      width: 90px;
      height: 10px;
      border-radius: 5px;
    }

    .sk-photo {
      width: 100%;
      border-radius: 0;
      margin: 0 -16px;
      width: calc(100% + 32px);
    }
    .sk-photo-single { height: 240px; border-radius: 0; }
    .sk-photo-double {
      display: flex;
      gap: 2px;
      height: 180px;
      margin: 0 -16px;
      width: calc(100% + 32px);
    }
    .sk-photo-double .sk-ph-half {
      flex: 1;
      border-radius: 0;
    }

    .sk-caption {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .sk-line-full  { width: 100%; height: 11px; border-radius: 5px; }
    .sk-line-half  { width: 60%;  height: 11px; border-radius: 5px; }

    .sk-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    .sk-action-pill {
      height: 34px;
      border-radius: 12px;
      flex: 1;
    }
    .sk-action-pill-sm {
      height: 34px;
      width: 90px;
      border-radius: 12px;
    }

    .sk-header {
      width: 100%;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
    }
    .sk-header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .sk-header-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .sk-header-title {
      width: 80px;
      height: 16px;
      border-radius: 6px;
    }
    .sk-header-right {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .sk-header-icon {
      width: 26px;
      height: 26px;
      border-radius: 50%;
    }

    /* Post card styles will be loaded from post.js if needed, but kept here for base */
    .post-card {
      background: #fff;
      width: 100%;
      border-bottom: 8px solid #f0f2f5;
      border-radius: 18px;
      margin: 0 0 8px 0;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div class="sticky-top">

  <!-- Skeleton header -->
  <div class="sk-header" id="skHeader">
    <div class="sk-header-left">
      <div class="sk-header-avatar sk-shine"></div>
      <div class="sk-header-title sk-shine"></div>
    </div>
    <div class="sk-header-right">
      <div class="sk-header-icon sk-shine"></div>
      <div class="sk-header-icon sk-shine"></div>
      <div class="sk-header-icon sk-shine"></div>
      <div class="sk-header-icon sk-shine"></div>
    </div>
  </div>

  <header class="header" id="realHeader" style="display:none;">
    <!-- Left: Avatar + "Home" -->
    <div class="header-left">
      <div class="avatar">
        <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg" width="36" height="36">
          <rect width="36" height="36" fill="#2a2a2a"/>
          <ellipse cx="18" cy="28" rx="11" ry="8" fill="#444"/>
          <circle cx="18" cy="14" r="7" fill="#555"/>
        </svg>
      </div>
      <span class="title">Michkee</span>
    </div>

    <!-- Right: Plus + Send + Bell -->
    <div class="header-right">
      <button class="icon-btn" aria-label="Add" id="addPostBtn">
        <svg class="icon-plus" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="14" cy="14" r="12.5" stroke="#3B97F0" stroke-width="2"/>
          <line x1="14" y1="8" x2="14" y2="20" stroke="#3B97F0" stroke-width="2" stroke-linecap="round"/>
          <line x1="8" y1="14" x2="20" y2="14" stroke="#3B97F0" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>

      <button class="icon-btn" aria-label="Messages" onclick="goToMessages()">
        <svg width="26px" height="26px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path fill-rule="evenodd" clip-rule="evenodd" d="M6.84572 18.6204C6.74782 18.0072 6.4668 17.4522 6.05816 17.0088C4.18319 15.5427 3 13.3942 3 11C3 6.58173 7.02944 3 12 3C16.9706 3 21 6.58173 21 11C21 15.4183 16.9706 19 12 19C11.1546 19 10.3365 18.8964 9.56074 18.7027C9.45389 18.676 9.34187 18.72 9.28125 18.8119C9.15858 18.998 9.02331 19.1851 8.87719 19.3674C8.64734 19.6542 8.39065 19.9289 8.11392 20.1685C7.59543 20.6174 7.00662 20.943 6.39232 20.9932C6.37166 20.9949 6.35097 20.9963 6.33025 20.9974C6.28866 20.9995 6.26498 20.9519 6.28953 20.9182C6.30109 20.9024 6.3125 20.8865 6.32376 20.8704C6.67743 20.3664 6.88397 19.7586 6.88397 19.1044C6.88397 19.0915 6.88389 19.0786 6.88373 19.0658C6.88185 18.9146 6.86893 18.7659 6.84572 18.6204ZM4.66223 18.4535C2.45613 16.6579 1 14.0103 1 11C1 5.26221 6.15283 1 12 1C17.8472 1 23 5.26221 23 11C23 16.7378 17.8472 21 12 21C11.3978 21 10.8057 20.9559 10.2276 20.8709C9.93606 21.2084 9.60764 21.5363 9.24519 21.8294C8.55521 22.3873 7.59485 22.9353 6.43241 22.9948L6.43238 22.9948C4.55136 23.0909 3.75168 21.003 4.67402 19.7392C4.81033 19.5524 4.88397 19.3363 4.88397 19.1044C4.88397 18.8684 4.80711 18.6449 4.66223 18.4535Z" fill="#3B97F0"/>
        </svg>
      </button>

      <button class="icon-btn" aria-label="Search">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="11" cy="11" r="7.5" stroke="#3B97F0" stroke-width="2"/>
          <line x1="16.5" y1="16.5" x2="21" y2="21" stroke="#3B97F0" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>

      <button class="icon-btn" aria-label="Notifications" onclick="goToNotifications()">
        <svg class="icon-bell" viewBox="0 0 26 28" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M13 2C13 2 6 5.5 6 13.5V19L4 21V22H22V21L20 19V13.5C20 5.5 13 2 13 2Z" stroke="#3B97F0" stroke-width="2" stroke-linejoin="round" fill="none"/>
          <path d="M10.5 22C10.5 23.38 11.62 24.5 13 24.5C14.38 24.5 15.5 23.38 15.5 22" stroke="#3B97F0" stroke-width="2" stroke-linecap="round" fill="none"/>
          <line x1="13" y1="2" x2="13" y2="4" stroke="#3B97F0" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </header>
  </div>

  <div class="scroll-feed">
    <!-- Skeleton Loader -->
    <div id="skeletonFeed" class="skeleton-feed">
      <!-- Stories skeleton -->
      <div class="sk-stories" style="border-bottom:8px solid #f0f2f5;" id="storiesSkeleton">
        <!-- Populated by story.js if needed -->
      </div>

      <!-- Post skeletons -->
      <div class="sk-card">
        <div class="sk-card-header">
          <div class="sk-avatar sk-shine"></div>
          <div class="sk-name-block">
            <div class="sk-name sk-shine"></div>
            <div class="sk-location sk-shine"></div>
          </div>
        </div>
        <div class="sk-photo sk-photo-single sk-shine"></div>
        <div class="sk-caption">
          <div class="sk-line-full sk-shine"></div>
          <div class="sk-line-half sk-shine"></div>
        </div>
        <div class="sk-actions">
          <div class="sk-action-pill sk-shine"></div>
          <div class="sk-action-pill-sm sk-shine"></div>
        </div>
      </div>
      <!-- More skeletons can be added here -->
    </div>

    <!-- Real Feed -->
    <div id="realFeed" style="display:none;">
      <!-- Stories Row will be injected by story.js -->
      <div id="storiesContainer" class="stories-row"></div>

      <!-- Posts Container will be injected by post.js -->
      <div id="postsContainer"></div>

      <!-- More button -->
      <div style="display:flex;justify-content:center;padding:20px 16px 24px;background:transparent;">
        <div style="border-radius:6px;box-shadow:0 2px 12px rgba(0,0,0,0.10);padding:10px 40px;cursor:default;pointer-events:none;user-select:none;background:transparent;">
          <span style="font-size:14px;font-weight:600;color:#3B97F0;">More</span>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="story.js"></script>
  <script type="module" src="post.js"></script>

  <script>
    // Simulate loading
    setTimeout(() => {
      document.getElementById('skeletonFeed').style.display = 'none';
      document.getElementById('realFeed').style.display = 'block';
      document.getElementById('skHeader').style.display = 'none';
      document.getElementById('realHeader').style.display = 'flex';
    }, 1800);

    function goToMessages() {
      window.location.href = 'Messages.html';
    }

    function goToNotifications() {
      // Placeholder
      alert("Notifications page would open here");
    }
  </script>
</body>
</html>
